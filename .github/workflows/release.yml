name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Next.js
        run: npx next build

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.js

      - name: Package with electron-builder
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_CACHE: ${{ env.LOCALAPPDATA }}\electron\Cache
          ELECTRON_BUILDER_CACHE: ${{ env.LOCALAPPDATA }}\electron-builder\Cache

      - name: Create no-install ZIP
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath "dist/Ghost City RLT No-Install $v.zip" -Force

      - name: Read version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: Ghost City RLT v${{ steps.pkg.outputs.VERSION }}
          files: |
            dist/*.exe
            dist/*.zip
          overwrite_files: true
          body: |
            ## ${{ steps.pkg.outputs.VERSION }}

            - Embedded PocketScout Utilities 0.9.12's complete National Signing Day workflow: combined assignment and roster-plan preview, explicit confirmation, roster-plan application, and final roster/depth-chart reconciliation.
            - Preserves normal incoming-freshman dealbreakers and NIL requirements by default, now correctly applied across every NSD path (manual recruit commits, board hard-commits, unsigned/transfer shortage fills, and Final Talent Rescue swaps); the legacy Invalid-dealbreaker behavior is now optional.
            - Creates a full pre-PocketScout restore point before changing the selected save.
            - Fixed Positional Depth and Roster Ratings after Transfer Wave by reading the game's authoritative team roster arrays.
            - Saves Dynamic Conference Realignment recommendations with each Signing Day import for review on the Realignment page.
            - Updated the embedded Dynamic Conference Realignment mod to upstream V0.2.1, fixing wrong or missing Mountain West recommendations on dynasties started after EA renamed that conference's save field from `MWC` to `MW`.
            - Fixed a crash reading properties of a season year (for example `reading '2025'`) on Realignment runs for dynasties with realignment history recorded before the V0.2.1 update above.
            - Includes both the portable single EXE and a faster-starting no-install ZIP/folder build.

            ## Upgrade note

            Replace your old portable exe with the new one; your existing tracker data remains intact.
            Existing preseason data can be refreshed by reimporting the already-modified save with Transfer Wave disabled.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
