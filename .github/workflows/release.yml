name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Next.js
        run: npx next build

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.js

      - name: Package with electron-builder
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_CACHE: ${{ env.LOCALAPPDATA }}\electron\Cache
          ELECTRON_BUILDER_CACHE: ${{ env.LOCALAPPDATA }}\electron-builder\Cache

      - name: Create no-install ZIP
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath "dist/Ghost City RLT No-Install $v.zip" -Force

      - name: Read version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: Ghost City RLT v${{ steps.pkg.outputs.VERSION }}
          files: |
            dist/*.exe
            dist/*.zip
          overwrite_files: true
          body: |
            ## ${{ steps.pkg.outputs.VERSION }}

            - Added **Force Win**, ported from Ace's CFB Toolkit 0.9.3's "Automatic Force Win," replacing CFB Rebalance (now fully removed). Evaluates every remaining regular-season matchup (weeks 1-15) and forces the modeled favorite to win where the mismatch is large enough.
            - Force Win runs as its own **Week 0** import stage, since it needs the save's CurrentWeekType to already be RegularSeason -- something that only happens once you've advanced the dynasty past Preseason and Signing Day in-game.
            - Toolbox exposes involvement level, model profile, and a per-team force/skip toggle for Force Win as configurable settings, available any time regardless of the save's current week. Creates an RLT backup before writing to the save.
            - Renamed the Realignment page to **Toolbox Outputs**, with sortable, team-logo tables and subtabs for Conference Realignment and Force Win history.
            - Import now offers three snapshot stages -- Preseason, Signing Day, and Week 0 -- and the Imported Seasons list shows each entry's source file name.
            - Fixed a `Map maximum size exceeded` crash on Signing Day imports with a large zero-offer-transfer class, caused by a redundant league-wide board scan on every transfer placement.
            - Includes both the portable single EXE and a faster-starting no-install ZIP/folder build.

            ## Upgrade note

            Replace your old portable exe with the new one; your existing tracker data, settings, and backups remain intact.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
