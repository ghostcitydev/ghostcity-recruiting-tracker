name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Next.js
        run: npx next build

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.js

      - name: Package with electron-builder
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_CACHE: ${{ env.LOCALAPPDATA }}\electron\Cache
          ELECTRON_BUILDER_CACHE: ${{ env.LOCALAPPDATA }}\electron-builder\Cache

      - name: Read version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: Ghost City RLT v${{ steps.pkg.outputs.VERSION }}
          files: dist/*.exe
          overwrite_files: true
          body: |
            ## 1.0.8

            - Added Dynamic Conference Realignment to the Signing Day workflow.
            - Updated Preseason Transfer Wave to v2.0.1.
            - Added Import history backup and restore packages. Restore replaces only matching year/snapshot records and preserves all other history.
            - Signing Day imports use the game's recorded committed destination; NSD Assign creates a full pre-PocketScout backup before any mod work begins.
            - Reduced portable build size by excluding local databases, environment files, old build output, and redundant upstream apps while retaining every embedded runtime resource.
            - Preseason order: Fang → Dynamic Recruiting Pipelines → Transfer Wave → CFB Rebalance → Import.

            ## Upgrade note

            Replace your old portable exe with the new one; your existing tracker data remains intact.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
