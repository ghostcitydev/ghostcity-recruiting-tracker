name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Next.js
        run: npx next build

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.js

      - name: Package with electron-builder
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_CACHE: ${{ env.LOCALAPPDATA }}\electron\Cache
          ELECTRON_BUILDER_CACHE: ${{ env.LOCALAPPDATA }}\electron-builder\Cache

      - name: Read version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: Ghost City RLT v${{ steps.pkg.outputs.VERSION }}
          files: dist/*.exe
          overwrite_files: true
          body: |
            ## Changes since 1.0.5

            - Added Fang's Recruiting Generator as an embedded preseason mod. Select its settings JSON in Toolbox; it runs before Transfer Wave, Rebalance, Pipelines, and the import.
            - Added Fang results and backup details to the import log.
            - Updated PocketScout Utilities to 0.9.10 for the current EA title update.
            - Updated Transfer Wave to v2.0, including configurable top-two destination handling for prestige-cap exceptions.
            - Fixed the portable build so required `madden-franchise` lookup data is included.
            - Added a clean optional local-browser workflow: `setup-ghost-city-rlt.bat` once, then `run-ghost-city-rlt.bat` for later launches.

            ## Upgrade note

            Replace your old portable exe with the new one; your existing tracker data remains intact.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
